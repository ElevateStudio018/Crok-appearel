[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Pages from the old site that no longer exist.
[[redirects]]
  from = "/team"
  to = "/about"
  status = 301

[[redirects]]
  from = "/videos"
  to = "/about"
  status = 301

[[redirects]]
  from = "/backstage"
  to = "/about"
  status = 301

[[redirects]]
  from = "/mailing-list"
  to = "/#newsletter"
  status = 301

[[redirects]]
  from = "/info"
  to = "/policies"
  status = 301

[[redirects]]
  from = "/checkout/return"
  to = "/checkout/success"
  status = 301

# Swedish 404 page for unknown /sv/ URLs (only used when no file matches).
[[redirects]]
  from = "/sv/*"
  to = "/sv/404"
  status = 404

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
